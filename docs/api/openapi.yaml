openapi: 3.1.0
info:
  title: GeoData Control API
  version: 1.0.0-draft
  description: |
    Hợp đồng API cho quản trị dữ liệu không gian. API sở hữu metadata và điều phối
    xử lý; client không được nhận S3 credential, bucket name hoặc object URI.
    Mọi thời điểm dùng RFC 3339 UTC. Các endpoint ghi yêu cầu quyền admin.
servers:
  - url: /api/geodata/v1
tags:
  - name: System
  - name: Datasets
  - name: Uploads
  - name: Jobs
  - name: Styles
  - name: Releases
  - name: Access
security:
  - bearerAuth: []
paths:
  /summary:
    get:
      tags: [System]
      operationId: getSummary
      summary: Tổng quan và health nghiệp vụ cho dashboard
      responses:
        '200':
          description: Tổng quan hiện tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Summary'
        default: { $ref: '#/components/responses/Problem' }
  /datasets:
    get:
      tags: [Datasets]
      operationId: listDatasets
      summary: Danh sách dữ liệu nguồn
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: q
          in: query
          schema: { type: string, maxLength: 200 }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/DatasetStatus' }
        - name: format
          in: query
          schema: { $ref: '#/components/schemas/SourceFormat' }
      responses:
        '200':
          description: Trang dataset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetPage'
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Datasets]
      operationId: createDataset
      summary: Tạo catalog dataset trước khi upload/import version đầu tiên
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDatasetRequest' }
      responses:
        '201':
          description: Dataset đã tạo
          headers:
            Location: { schema: { type: string, format: uri-reference } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dataset' }
        default: { $ref: '#/components/responses/Problem' }
  /datasets/{datasetId}:
    parameters: [ { $ref: '#/components/parameters/DatasetId' } ]
    get:
      tags: [Datasets]
      operationId: getDataset
      responses:
        '200':
          description: Chi tiết dataset
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dataset' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Datasets]
      operationId: updateDataset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateDatasetRequest' }
      responses:
        '200':
          description: Dataset đã cập nhật
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dataset' }
        default: { $ref: '#/components/responses/Problem' }
  /datasets/{datasetId}/archive:
    parameters: [ { $ref: '#/components/parameters/DatasetId' } ]
    post:
      tags: [Datasets]
      operationId: archiveDataset
      summary: Archive dataset; không xóa object hoặc version lịch sử
      responses:
        '200':
          description: Dataset đã archive
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dataset' }
        default: { $ref: '#/components/responses/Problem' }
  /datasets/{datasetId}/versions:
    parameters: [ { $ref: '#/components/parameters/DatasetId' } ]
    get:
      tags: [Datasets]
      operationId: listDatasetVersions
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Trang version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatasetVersionPage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Datasets]
      operationId: createDatasetVersion
      summary: Khai báo một version để bắt đầu upload/import
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateVersionRequest' }
      responses:
        '201':
          description: Version ở trạng thái awaiting_upload
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatasetVersion' }
        default: { $ref: '#/components/responses/Problem' }
  /dataset-versions/{versionId}:
    parameters: [ { $ref: '#/components/parameters/VersionId' } ]
    get:
      tags: [Datasets]
      operationId: getDatasetVersion
      responses:
        '200':
          description: Metadata và kết quả kiểm tra version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatasetVersion' }
        default: { $ref: '#/components/responses/Problem' }
  /uploads:
    post:
      tags: [Uploads]
      operationId: initiateUpload
      summary: Khởi tạo multipart upload cho một dataset version
      description: |
        API kiểm soát key staging nội bộ và trả URL ký ngắn hạn, chỉ ghi được
        đúng object của version đó. URL là opaque và không được lưu vào database.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InitiateUploadRequest' }
      responses:
        '201':
          description: Phiên upload
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadSession' }
        default: { $ref: '#/components/responses/Problem' }
  /uploads/{uploadId}/parts:
    parameters: [ { $ref: '#/components/parameters/UploadId' } ]
    post:
      tags: [Uploads]
      operationId: signUploadParts
      summary: Cấp URL ký cho các part chưa upload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignPartsRequest' }
      responses:
        '200':
          description: URL upload cho từng part
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignedPartsResponse' }
        default: { $ref: '#/components/responses/Problem' }
  /uploads/{uploadId}/complete:
    parameters: [ { $ref: '#/components/parameters/UploadId' } ]
    post:
      tags: [Uploads]
      operationId: completeUpload
      summary: Hoàn tất multipart upload và đưa version vào hàng đợi kiểm tra
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteUploadRequest' }
      responses:
        '202':
          description: Upload đã xác nhận; validation chạy bất đồng bộ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatasetVersion' }
        default: { $ref: '#/components/responses/Problem' }
  /uploads/{uploadId}:
    parameters: [ { $ref: '#/components/parameters/UploadId' } ]
    delete:
      tags: [Uploads]
      operationId: abortUpload
      summary: Hủy upload đang mở
      responses:
        '204': { description: Đã hủy }
        default: { $ref: '#/components/responses/Problem' }
  /jobs:
    get:
      tags: [Jobs]
      operationId: listJobs
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: datasetVersionId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/JobStatus' }
      responses:
        '200':
          description: Trang job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobPage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Jobs]
      operationId: createConversionJob
      summary: Yêu cầu chuyển đổi một dataset version đã validated
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateJobRequest' }
      responses:
        '202':
          description: Job được xếp hàng
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversionJob' }
        default: { $ref: '#/components/responses/Problem' }
  /jobs/{jobId}:
    parameters: [ { $ref: '#/components/parameters/JobId' } ]
    get:
      tags: [Jobs]
      operationId: getJob
      responses:
        '200':
          description: Trạng thái, progress và artifact của job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversionJob' }
        default: { $ref: '#/components/responses/Problem' }
  /jobs/{jobId}/cancel:
    parameters: [ { $ref: '#/components/parameters/JobId' } ]
    post:
      tags: [Jobs]
      operationId: cancelJob
      responses:
        '202':
          description: Yêu cầu hủy đã được chấp nhận
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversionJob' }
        default: { $ref: '#/components/responses/Problem' }
  /jobs/{jobId}/retry:
    parameters: [ { $ref: '#/components/parameters/JobId' } ]
    post:
      tags: [Jobs]
      operationId: retryJob
      summary: Tạo attempt mới từ cùng input và cấu hình bất biến
      responses:
        '202':
          description: Job retry được xếp hàng
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversionJob' }
        default: { $ref: '#/components/responses/Problem' }
  /jobs/{jobId}/events:
    parameters: [ { $ref: '#/components/parameters/JobId' } ]
    get:
      tags: [Jobs]
      operationId: streamJobEvents
      summary: Server-sent events cho progress; client fallback polling getJob
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema: { type: string }
        default: { $ref: '#/components/responses/Problem' }
  /artifacts:
    get:
      tags: [Jobs]
      operationId: listArtifacts
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: datasetVersionId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Artifact đã tạo từ job thành công
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactPage' }
        default: { $ref: '#/components/responses/Problem' }
  /styles:
    get:
      tags: [Styles]
      operationId: listStyleVersions
      parameters: [ { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ]
      responses:
        '200':
          description: Trang style version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StylePage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Styles]
      operationId: createStyleVersion
      summary: Lưu MapLibre style version bất biến
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateStyleRequest' }
      responses:
        '201':
          description: Style đã validate và version hóa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StyleVersion' }
        default: { $ref: '#/components/responses/Problem' }
  /styles/{styleId}:
    parameters: [ { $ref: '#/components/parameters/StyleId' } ]
    get:
      tags: [Styles]
      operationId: getStyleVersion
      responses:
        '200':
          description: Style version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StyleVersion' }
        default: { $ref: '#/components/responses/Problem' }
  /releases:
    get:
      tags: [Releases]
      operationId: listReleases
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ReleaseStatus' }
        - name: visibility
          in: query
          schema: { $ref: '#/components/schemas/Visibility' }
      responses:
        '200':
          description: Trang release
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReleasePage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Releases]
      operationId: createRelease
      summary: Tạo draft release từ style và artifact đã validated
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReleaseRequest' }
      responses:
        '201':
          description: Draft release
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MapRelease' }
        default: { $ref: '#/components/responses/Problem' }
  /releases/{releaseId}:
    parameters: [ { $ref: '#/components/parameters/ReleaseId' } ]
    get:
      tags: [Releases]
      operationId: getRelease
      responses:
        '200':
          description: Release
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MapRelease' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Releases]
      operationId: updateReleaseDraft
      summary: Chỉ draft chưa publish được sửa
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateReleaseRequest' }
      responses:
        '200':
          description: Draft đã cập nhật
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MapRelease' }
        default: { $ref: '#/components/responses/Problem' }
  /releases/{releaseId}/publish:
    parameters: [ { $ref: '#/components/parameters/ReleaseId' } ]
    post:
      tags: [Releases]
      operationId: publishRelease
      responses:
        '200':
          description: Release đã publish
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MapRelease' }
        default: { $ref: '#/components/responses/Problem' }
  /releases/{releaseId}/unpublish:
    parameters: [ { $ref: '#/components/parameters/ReleaseId' } ]
    post:
      tags: [Releases]
      operationId: unpublishRelease
      responses:
        '200':
          description: Release đã chuyển về archived
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MapRelease' }
        default: { $ref: '#/components/responses/Problem' }
  /releases/{releaseId}/rollback:
    parameters: [ { $ref: '#/components/parameters/ReleaseId' } ]
    post:
      tags: [Releases]
      operationId: rollbackRelease
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetReleaseId]
              properties:
                targetReleaseId: { type: string, format: uuid }
      responses:
        '200':
          description: Release mới trỏ tới snapshot đã chọn
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MapRelease' }
        default: { $ref: '#/components/responses/Problem' }
  /access/grants:
    get:
      tags: [Access]
      operationId: listAccessGrants
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: principalType
          in: query
          schema: { type: string, enum: [user, group] }
        - name: status
          in: query
          schema: { type: string, enum: [active, revoked] }
      responses:
        '200':
          description: Trang ACL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrantPage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Access]
      operationId: createAccessGrant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateGrantRequest' }
      responses:
        '201':
          description: Quyền đã cấp
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessGrant' }
        default: { $ref: '#/components/responses/Problem' }
  /access/grants/{grantId}/revoke:
    parameters: [ { $ref: '#/components/parameters/GrantId' } ]
    post:
      tags: [Access]
      operationId: revokeAccessGrant
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: Grant đã revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessGrant' }
        default: { $ref: '#/components/responses/Problem' }
  /audit-events:
    get:
      tags: [Access]
      operationId: listAuditEvents
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: action
          in: query
          schema: { type: string, enum: [grant_created, grant_revoked, release_published, release_unpublished] }
      responses:
        '200':
          description: Nhật ký chỉ đọc
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEventPage' }
        default: { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor từ trang trước.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, default: 25, minimum: 1, maximum: 100 }
    DatasetId: { name: datasetId, in: path, required: true, schema: { type: string, format: uuid } }
    VersionId: { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
    UploadId: { name: uploadId, in: path, required: true, schema: { type: string, format: uuid } }
    JobId: { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
    StyleId: { name: styleId, in: path, required: true, schema: { type: string, format: uuid } }
    ReleaseId: { name: releaseId, in: path, required: true, schema: { type: string, format: uuid } }
    GrantId: { name: grantId, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    Problem:
      description: Lỗi theo RFC 9457
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    PageInfo:
      type: object
      required: [limit]
      properties:
        nextCursor: { type: [string, 'null'] }
        limit: { type: integer }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code:
          type: string
          examples: [validation_failed, version_not_ready, forbidden]
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
    SourceFormat:
      type: string
      enum: [osm_pbf, geotiff, geopackage, shapefile_zip, mbtiles]
    DatasetStatus:
      type: string
      enum: [active, archived]
    VersionStatus:
      type: string
      enum: [awaiting_upload, uploading, validating, ready, rejected, archived]
    JobStatus:
      type: string
      enum: [queued, running, succeeded, failed, canceled, canceling]
    Visibility:
      type: string
      enum: [public, authenticated, restricted]
    ReleaseStatus:
      type: string
      enum: [draft, published, archived]
    Dataset:
      type: object
      required: [id, name, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        tags: { type: array, items: { type: string } }
        status: { $ref: '#/components/schemas/DatasetStatus' }
        latestVersion: { anyOf: [ { $ref: '#/components/schemas/DatasetVersionSummary' }, { type: 'null' } ] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DatasetVersionSummary:
      type: object
      required: [id, version, format, status, byteSize, createdAt]
      properties:
        id: { type: string, format: uuid }
        version: { type: string, maxLength: 80 }
        format: { $ref: '#/components/schemas/SourceFormat' }
        status: { $ref: '#/components/schemas/VersionStatus' }
        byteSize: { type: integer, format: int64, minimum: 0 }
        createdAt: { type: string, format: date-time }
    DatasetVersion:
      allOf:
        - $ref: '#/components/schemas/DatasetVersionSummary'
        - type: object
          required: [datasetId]
          properties:
            datasetId: { type: string, format: uuid }
            sourceFileName: { type: string }
            sha256: { type: [string, 'null'], pattern: '^[A-Fa-f0-9]{64}$' }
            crs: { type: [string, 'null'], examples: [EPSG:4326] }
            bounds:
              type: [array, 'null']
              minItems: 4
              maxItems: 4
              items: { type: number }
            metadata: { type: object, additionalProperties: true }
            validation:
              type: array
              items: { $ref: '#/components/schemas/ValidationMessage' }
    ValidationMessage:
      type: object
      required: [level, code, message]
      properties:
        level: { type: string, enum: [warning, error] }
        code: { type: string }
        message: { type: string }
    CreateDatasetRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        tags: { type: array, maxItems: 20, items: { type: string, maxLength: 50 } }
    UpdateDatasetRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        tags: { type: array, maxItems: 20, items: { type: string, maxLength: 50 } }
    CreateVersionRequest:
      type: object
      required: [version, format, sourceFileName, byteSize]
      properties:
        version: { type: string, minLength: 1, maxLength: 80 }
        format: { $ref: '#/components/schemas/SourceFormat' }
        sourceFileName: { type: string, minLength: 1, maxLength: 255 }
        byteSize: { type: integer, format: int64, minimum: 1 }
        expectedSha256: { type: string, pattern: '^[A-Fa-f0-9]{64}$' }
        sourceLicense: { type: string, maxLength: 300 }
    DatasetPage:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Dataset' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    DatasetVersionPage:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/DatasetVersion' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    InitiateUploadRequest:
      type: object
      required: [datasetVersionId]
      properties:
        datasetVersionId: { type: string, format: uuid }
        partSize: { type: integer, minimum: 5242880, maximum: 536870912, default: 16777216 }
    UploadSession:
      type: object
      required: [id, datasetVersionId, partSize, expiresAt]
      properties:
        id: { type: string, format: uuid }
        datasetVersionId: { type: string, format: uuid }
        partSize: { type: integer }
        expiresAt: { type: string, format: date-time }
    SignPartsRequest:
      type: object
      required: [partNumbers]
      properties:
        partNumbers:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: integer, minimum: 1, maximum: 10000 }
    SignedPartsResponse:
      type: object
      required: [parts]
      properties:
        parts:
          type: array
          items:
            type: object
            required: [partNumber, url, expiresAt]
            properties:
              partNumber: { type: integer }
              url: { type: string, format: uri }
              expiresAt: { type: string, format: date-time }
    CompleteUploadRequest:
      type: object
      required: [parts]
      properties:
        parts:
          type: array
          minItems: 1
          items:
            type: object
            required: [partNumber, etag]
            properties:
              partNumber: { type: integer }
              etag: { type: string }
    CreateJobRequest:
      type: object
      required: [datasetVersionId, output]
      properties:
        datasetVersionId: { type: string, format: uuid }
        output:
          type: object
          required: [kind, targetCrs, minZoom, maxZoom]
          properties:
            kind: { type: string, enum: [raster_tiles, vector_tiles, mbtiles] }
            targetCrs: { type: string, examples: [EPSG:3857] }
            minZoom: { type: integer, minimum: 0, maximum: 24 }
            maxZoom: { type: integer, minimum: 0, maximum: 24 }
            layers: { type: array, items: { type: string }, maxItems: 100 }
    ConversionJob:
      type: object
      required: [id, datasetVersionId, status, progress, output, createdAt]
      properties:
        id: { type: string, format: uuid }
        datasetVersionId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/JobStatus' }
        progress: { type: integer, minimum: 0, maximum: 100 }
        currentStep: { type: [string, 'null'] }
        output: { $ref: '#/components/schemas/CreateJobRequest/properties/output' }
        attempt: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        failure: { anyOf: [ { $ref: '#/components/schemas/JobFailure' }, { type: 'null' } ] }
        artifacts: { type: array, items: { $ref: '#/components/schemas/Artifact' } }
    JobFailure:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        retryable: { type: boolean }
    JobPage:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ConversionJob' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    Artifact:
      type: object
      required: [id, jobId, kind, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        jobId: { type: string, format: uuid }
        kind: { type: string, enum: [raster_tiles, vector_tiles, mbtiles] }
        status: { type: string, enum: [ready, rejected] }
        tileJsonUrl: { type: [string, 'null'], format: uri-reference }
        bounds: { type: array, items: { type: number }, minItems: 4, maxItems: 4 }
        minZoom: { type: integer }
        maxZoom: { type: integer }
        createdAt: { type: string, format: date-time }
    ArtifactPage:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Artifact' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    CreateStyleRequest:
      type: object
      required: [name, version, document]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        version: { type: string, minLength: 1, maxLength: 80 }
        comment: { type: string, maxLength: 2000 }
        document:
          type: object
          description: MapLibre Style Specification v8; server validate URL và nguồn nội bộ.
          additionalProperties: true
    StyleVersion:
      type: object
      required: [id, name, version, document, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        version: { type: string }
        comment: { type: string }
        document: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }
    StylePage:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/StyleVersion' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    CreateReleaseRequest:
      type: object
      required: [name, slug, styleId, artifactIds, visibility]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        description: { type: string, maxLength: 2000 }
        styleId: { type: string, format: uuid }
        artifactIds: { type: array, minItems: 1, maxItems: 50, items: { type: string, format: uuid } }
        visibility: { $ref: '#/components/schemas/Visibility' }
    UpdateReleaseRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        styleId: { type: string, format: uuid }
        artifactIds: { type: array, minItems: 1, maxItems: 50, items: { type: string, format: uuid } }
        visibility: { $ref: '#/components/schemas/Visibility' }
    MapRelease:
      type: object
      required: [id, name, slug, status, visibility, styleId, artifactIds, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/ReleaseStatus' }
        visibility: { $ref: '#/components/schemas/Visibility' }
        styleId: { type: string, format: uuid }
        artifactIds: { type: array, items: { type: string, format: uuid } }
        publishedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ReleasePage:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/MapRelease' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    CreateGrantRequest:
      type: object
      required: [principalType, principalId, releaseIds, scope]
      properties:
        principalType: { type: string, enum: [user, group] }
        principalId: { type: string, minLength: 1, maxLength: 255, description: Subject from identity authority }
        releaseIds: { type: array, minItems: 1, maxItems: 100, items: { type: string, format: uuid } }
        scope: { type: string, enum: [view, export] }
        note: { type: string, maxLength: 2000 }
    AccessGrant:
      type: object
      required: [id, principalType, principalId, releaseIds, scope, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        principalType: { type: string, enum: [user, group] }
        principalId: { type: string }
        releaseIds: { type: array, items: { type: string, format: uuid } }
        scope: { type: string, enum: [view, export] }
        note: { type: string }
        status: { type: string, enum: [active, revoked] }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }
        revokedAt: { type: [string, 'null'], format: date-time }
    GrantPage:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AccessGrant' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    AuditEvent:
      type: object
      required: [id, action, actorId, resourceType, resourceId, createdAt]
      properties:
        id: { type: string, format: uuid }
        action: { type: string }
        actorId: { type: string }
        resourceType: { type: string, enum: [grant, release] }
        resourceId: { type: string, format: uuid }
        details: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    AuditEventPage:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    Summary:
      type: object
      required: [datasets, jobs, releases, services, generatedAt]
      properties:
        datasets: { type: integer, minimum: 0 }
        jobs:
          type: object
          required: [queued, running, failed]
          properties:
            queued: { type: integer, minimum: 0 }
            running: { type: integer, minimum: 0 }
            failed: { type: integer, minimum: 0 }
        releases: { type: integer, minimum: 0 }
        services:
          type: array
          items:
            type: object
            required: [name, state]
            properties:
              name: { type: string, enum: [authentication, storage, tiles] }
              state: { type: string, enum: [ready, degraded, unavailable] }
        generatedAt: { type: string, format: date-time }
