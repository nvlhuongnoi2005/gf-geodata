apiVersion: apps/v1
kind: Deployment
metadata: { name: geodata-api, namespace: tile-server }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: geodata-api } }
  template:
    metadata: { labels: { app.kubernetes.io/name: geodata-api, app.kubernetes.io/part-of: tile-server } }
    spec:
      imagePullSecrets: [{ name: ghcr-pull }]
      initContainers:
        - name: migrate
          image: ghcr.io/nvlhuongnoi2005/tile-server/geodata-api:dev
          imagePullPolicy: Always
          command: ["/usr/local/bin/geodata-migrate"]
          envFrom: [{ secretRef: { name: geodata-api } }]
      containers:
        - name: api
          image: ghcr.io/nvlhuongnoi2005/tile-server/geodata-api:dev
          ports: [{ name: http, containerPort: 8090 }]
          envFrom: [{ secretRef: { name: geodata-api } }]
          readinessProbe: { httpGet: { path: /healthz, port: http } }
          livenessProbe: { httpGet: { path: /healthz, port: http } }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: "1", memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: geodata-api, namespace: tile-server }
spec:
  selector: { app.kubernetes.io/name: geodata-api }
  ports: [{ name: http, port: 8090, targetPort: http }]
