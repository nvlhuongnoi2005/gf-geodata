apiVersion: v1
kind: Secret
metadata: { name: geodata-api, namespace: tile-server }
type: Opaque
stringData:
  DATABASE_URL: postgresql://replace-user:replace-password@geodata-postgresql:5432/geodata?sslmode=disable
  GEODATA_AUTH_JWKS_URL: https://replace-with-webgis-jwks
  GEODATA_AUTH_ISSUER: replace-with-webgis-issuer
  GEODATA_AUTH_AUDIENCE: geodata-api
