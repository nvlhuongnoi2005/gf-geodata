apiVersion: v1
kind: Service
metadata:
  name: geodata-catalog-postgresql
  namespace: tile-server
  labels:
    app.kubernetes.io/name: geodata-catalog-postgresql
    app.kubernetes.io/part-of: geodata
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: geodata-catalog-postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: geodata-catalog-postgresql
  namespace: tile-server
  labels:
    app.kubernetes.io/name: geodata-catalog-postgresql
    app.kubernetes.io/part-of: geodata
spec:
  serviceName: geodata-catalog-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: geodata-catalog-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: geodata-catalog-postgresql
        app.kubernetes.io/part-of: geodata
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: postgresql
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: geodata-catalog-postgresql
                  key: database
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: geodata-catalog-postgresql
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: geodata-catalog-postgresql
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          startupProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 20Gi
