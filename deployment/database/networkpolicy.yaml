apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: geodata-catalog-postgresql-private
  namespace: tile-server
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: geodata-catalog-postgresql
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: geodata-upload
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: geodata-worker
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: geodata-tile-gateway
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: webgis
          podSelector:
            matchLabels:
              app.kubernetes.io/name: geodata-tileserver-cache-warmer
      ports:
        - protocol: TCP
          port: 5432
