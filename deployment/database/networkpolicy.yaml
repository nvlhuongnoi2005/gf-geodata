apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: geodata-postgresql-private
  namespace: tile-server
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: geodata-postgresql }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: geodata-api } }
      ports: [{ protocol: TCP, port: 5432 }]
