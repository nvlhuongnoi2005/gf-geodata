# /auth and /api requests are proxied by this pod to their internal services.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: geodata-frontend-private
  namespace: tile-server
  labels:
    app.kubernetes.io/name: geodata-frontend
    app.kubernetes.io/part-of: tile-server
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: geodata-frontend
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: webgis
          podSelector:
            matchLabels:
              app.kubernetes.io/name: controller
      ports:
        - protocol: TCP
          port: 3001
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tile-server
          podSelector:
            matchLabels:
              app.kubernetes.io/name: geodata-upload
      ports:
        - protocol: TCP
          port: 8090
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
