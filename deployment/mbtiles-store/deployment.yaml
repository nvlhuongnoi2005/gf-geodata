apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: geodata-mbtiles-data
  namespace: tile-server
  labels:
    app.kubernetes.io/name: geodata-mbtiles-data
    app.kubernetes.io/part-of: geodata
spec:
  # ReadWriteOnce is appropriate for the current single-node development
  # cluster. Use an RWX storage class before spreading gateway replicas across
  # nodes in production.
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: geodata-mbtiles-store-warmer
  namespace: tile-server
  labels:
    app.kubernetes.io/name: geodata-mbtiles-store-warmer
    app.kubernetes.io/part-of: geodata
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: geodata-mbtiles-store-warmer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: geodata-mbtiles-store-warmer
        app.kubernetes.io/part-of: geodata
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # This PVC is owned exclusively by GeoData. Prepare it once so the
        # non-root warmer can atomically create immutable MBTiles files even
        # on storage classes that do not apply fsGroup permissions themselves.
        - name: prepare-mbtiles-store
          image: busybox:1.37
          command: ["sh", "-ec", "mkdir -p /var/lib/geodata/mbtiles && chown 10001:10001 /var/lib/geodata/mbtiles && chmod 0770 /var/lib/geodata/mbtiles"]
          volumeMounts:
            - { name: mbtiles-data, mountPath: /var/lib/geodata/mbtiles }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL], add: [CHOWN, FOWNER] }
            readOnlyRootFilesystem: true
            runAsUser: 0
            runAsGroup: 0
      containers:
        - name: mbtiles-store-warmer
          image: ghcr.io/nvlhuongnoi2005/tile-server/geodata-worker:dev
          imagePullPolicy: Always
          env:
            - { name: WORKER_MODE, value: mbtiles-store-warmer }
            - { name: JOB_POLL_INTERVAL, value: 5s }
            - { name: MBTILES_STORE_ROOT, value: /var/lib/geodata/mbtiles }
            - { name: S3_ENDPOINT, value: http://seaweedfs-s3.storage.svc.cluster.local:8333 }
            - { name: S3_REGION, value: us-east-1 }
            - { name: S3_DERIVED_BUCKET, value: geodata-derived }
            - { name: POSTGRES_HOST, value: geodata-catalog-postgresql }
            - { name: POSTGRES_PORT, value: "5432" }
            - { name: POSTGRES_SSLMODE, value: disable }
            - name: POSTGRES_DATABASE
              valueFrom: { secretKeyRef: { name: geodata-catalog-postgresql, key: database } }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: geodata-catalog-postgresql, key: username } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: geodata-catalog-postgresql, key: password } }
            - name: S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: geodata-worker-s3, key: access-key } }
            - name: S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: geodata-worker-s3, key: secret-key } }
          volumeMounts:
            - { name: mbtiles-data, mountPath: /var/lib/geodata/mbtiles }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
      volumes:
        - name: mbtiles-data
          persistentVolumeClaim:
            claimName: geodata-mbtiles-data
