# Copy this file to s3-bootstrap-credentials.yaml and populate it with the
# bootstrap identity from seaweedfs-s3-config.yaml. Do not commit either file.
apiVersion: v1
kind: Secret
metadata:
  name: geodata-s3-bootstrap
  namespace: tile-server
  labels:
    app.kubernetes.io/part-of: tile-server
type: Opaque
stringData:
  S3_ENDPOINT: http://seaweedfs-s3.tile-server.svc.cluster.local:8333
  S3_REGION: us-east-1
  S3_ACCESS_KEY: replace-bootstrap-access-key
  S3_SECRET_KEY: replace-bootstrap-secret-key
  S3_RAW_BUCKET: geodata-raw
  S3_DERIVED_BUCKET: geodata-derived
  S3_STYLES_BUCKET: geodata-styles
