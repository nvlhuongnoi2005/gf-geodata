apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: seaweedfs-s3-private
  namespace: storage
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tile-server
          podSelector:
            matchLabels:
              app.kubernetes.io/name: geodata-upload
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tile-server
          podSelector:
            matchLabels:
              app.kubernetes.io/name: geodata-worker
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tile-server
          podSelector:
            matchLabels:
              app.kubernetes.io/name: geodata-mbtiles-store-warmer
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tile-server
          podSelector:
            matchLabels:
              app.kubernetes.io/name: geodata-tile-gateway
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: webgis
          podSelector:
            matchLabels:
              app.kubernetes.io/name: geodata-tileserver-cache-warmer
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: geodata-bucket-bootstrap
      ports:
        - protocol: TCP
          port: 8333
