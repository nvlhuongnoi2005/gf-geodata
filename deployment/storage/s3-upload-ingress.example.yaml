# Optional and deliberately excluded from kustomization.yaml. Enable only when
# admins must upload from a browser. It must be reachable solely on the private
# network, protected by TLS, and only receive short-lived presigned multipart
# upload requests scoped to geodata-raw/staging/<dataset-version>/.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seaweedfs-s3-upload
  namespace: tile-server
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [s3.geodata.internal]
      secretName: seaweedfs-s3-upload-tls
  rules:
    - host: s3.geodata.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: seaweedfs-s3
                port:
                  name: s3
