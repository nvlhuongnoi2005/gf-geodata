# This Job is idempotent. It creates the private storage buckets used by the
# geodata platform and enables versioning before any upload is accepted.
apiVersion: batch/v1
kind: Job
metadata:
  name: geodata-s3-bootstrap
  namespace: tile-server
  labels:
    app.kubernetes.io/name: geodata-s3-bootstrap
    app.kubernetes.io/part-of: tile-server
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: geodata-s3-bootstrap
        app.kubernetes.io/part-of: tile-server
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          # This image must be mirrored to the internal registry before
          # deployment. The cluster must never pull from a public registry.
          image: registry.internal/platform/aws-cli:2.31.22
          imagePullPolicy: IfNotPresent
          env:
            - name: S3_ENDPOINT
              valueFrom:
                secretKeyRef: { name: geodata-s3-bootstrap, key: S3_ENDPOINT }
            - name: S3_REGION
              valueFrom:
                secretKeyRef: { name: geodata-s3-bootstrap, key: S3_REGION }
            - name: S3_RAW_BUCKET
              valueFrom:
                secretKeyRef: { name: geodata-s3-bootstrap, key: S3_RAW_BUCKET }
            - name: S3_DERIVED_BUCKET
              valueFrom:
                secretKeyRef: { name: geodata-s3-bootstrap, key: S3_DERIVED_BUCKET }
            - name: S3_STYLES_BUCKET
              valueFrom:
                secretKeyRef: { name: geodata-s3-bootstrap, key: S3_STYLES_BUCKET }
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: geodata-s3-bootstrap, key: S3_ACCESS_KEY }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: geodata-s3-bootstrap, key: S3_SECRET_KEY }
            - name: AWS_DEFAULT_REGION
              valueFrom:
                secretKeyRef: { name: geodata-s3-bootstrap, key: S3_REGION }
          command: ["/bin/sh", "-ec"]
          args:
            - |
              s3() { aws --endpoint-url "$S3_ENDPOINT" "$@"; }
              for attempt in $(seq 1 60); do
                if s3 s3api list-buckets >/dev/null 2>&1; then
                  break
                fi
                echo "Waiting for SeaweedFS S3 ($attempt/60)..."
                sleep 2
              done
              s3 s3api list-buckets >/dev/null
              ensure_bucket() {
                bucket="$1"
                if ! s3 s3api head-bucket --bucket "$bucket" 2>/dev/null; then
                  s3 s3api create-bucket --bucket "$bucket"
                fi
                s3 s3api put-bucket-versioning --bucket "$bucket" --versioning-configuration Status=Enabled
              }
              put_lifecycle() {
                bucket="$1"
                days="$2"
                printf '%s\n' "{\"Rules\":[{\"ID\":\"abort-incomplete-multipart\",\"Status\":\"Enabled\",\"Filter\":{\"Prefix\":\"\"},\"AbortIncompleteMultipartUpload\":{\"DaysAfterInitiation\":2}},{\"ID\":\"expire-noncurrent-versions\",\"Status\":\"Enabled\",\"Filter\":{\"Prefix\":\"\"},\"NoncurrentVersionExpiration\":{\"NoncurrentDays\":$days}}]}" > /tmp/lifecycle.json
                s3 s3api put-bucket-lifecycle-configuration --bucket "$bucket" --lifecycle-configuration file:///tmp/lifecycle.json
              }
              ensure_bucket "$S3_RAW_BUCKET"
              ensure_bucket "$S3_DERIVED_BUCKET"
              ensure_bucket "$S3_STYLES_BUCKET"
              put_lifecycle "$S3_RAW_BUCKET" 90
              put_lifecycle "$S3_DERIVED_BUCKET" 30
              put_lifecycle "$S3_STYLES_BUCKET" 30
              echo "SeaweedFS S3 geodata buckets are ready."

