# Copy this file to seaweedfs-s3-config.yaml, generate unique values and keep
# it outside Git. Only the SeaweedFS pod may mount this complete identity file.
apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-s3-config
  namespace: tile-server
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/part-of: tile-server
type: Opaque
stringData:
  s3.json: |
    {
      "identities": [
        {
          "name": "bootstrap",
          "credentials": [{ "accessKey": "replace-bootstrap-access-key", "secretKey": "replace-bootstrap-secret-key" }],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]
        },
        {
          "name": "geodata-api",
          "credentials": [{ "accessKey": "replace-api-access-key", "secretKey": "replace-api-secret-key" }],
          "actions": [
            "Read:geodata-raw", "Write:geodata-raw", "List:geodata-raw",
            "Read:geodata-derived", "List:geodata-derived",
            "Read:geodata-styles", "Write:geodata-styles", "List:geodata-styles"
          ]
        },
        {
          "name": "geodata-worker",
          "credentials": [{ "accessKey": "replace-worker-access-key", "secretKey": "replace-worker-secret-key" }],
          "actions": [
            "Read:geodata-raw", "List:geodata-raw",
            "Read:geodata-derived", "Write:geodata-derived", "List:geodata-derived"
          ]
        },
        {
          "name": "tile-gateway",
          "credentials": [{ "accessKey": "replace-gateway-access-key", "secretKey": "replace-gateway-secret-key" }],
          "actions": ["Read:geodata-derived", "Read:geodata-styles"]
        }
      ]
    }
