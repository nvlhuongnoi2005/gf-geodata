apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
  namespace: storage
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/part-of: geodata
spec:
  serviceName: seaweedfs
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs
        app.kubernetes.io/part-of: geodata
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.48
          imagePullPolicy: IfNotPresent
          args:
            - server
            - -dir=/data
            - -s3
            - -s3.port=8333
            - -s3.port.grpc=18333
            - -s3.config=/etc/seaweedfs/s3.json
          ports:
            - name: s3
              containerPort: 8333
              protocol: TCP
            - name: s3-grpc
              containerPort: 18333
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
            - name: s3-config
              mountPath: /etc/seaweedfs/s3.json
              subPath: s3.json
              readOnly: true
          startupProbe:
            tcpSocket:
              port: s3
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 100Gi
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-s3
  namespace: storage
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/part-of: geodata
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: seaweedfs
  ports:
    - name: s3
      port: 8333
      targetPort: s3
      protocol: TCP
