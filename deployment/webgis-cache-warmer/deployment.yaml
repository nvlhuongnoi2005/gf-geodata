apiVersion: apps/v1
kind: Deployment
metadata:
  name: geodata-tileserver-cache-warmer
  namespace: webgis
  labels:
    app.kubernetes.io/name: geodata-tileserver-cache-warmer
    app.kubernetes.io/part-of: geodata
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: geodata-tileserver-cache-warmer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: geodata-tileserver-cache-warmer
        app.kubernetes.io/part-of: geodata
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Existing WebGIS datasets are root-owned. Grant the warmer access only
        # to its own subtree; never recurse through or alter other map data.
        - name: prepare-geodata-cache-directory
          image: busybox:1.37
          command: ["sh", "-ec", "mkdir -p /tile-server/data/mbtiles/geodata && chown 10001:10001 /tile-server/data/mbtiles/geodata && chmod 0770 /tile-server/data/mbtiles/geodata"]
          volumeMounts:
            - { name: tile-data, mountPath: /tile-server/data }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL], add: [CHOWN, FOWNER] }
            readOnlyRootFilesystem: true
            runAsUser: 0
            runAsGroup: 0
      containers:
        - name: cache-warmer
          image: ghcr.io/nvlhuongnoi2005/tile-server/geodata-worker:dev
          imagePullPolicy: Always
          env:
            - { name: WORKER_MODE, value: tileserver-cache-warmer }
            - { name: JOB_POLL_INTERVAL, value: 5s }
            # Keep GeoData artifacts under the same MBTiles directory already
            # used by the existing WebGIS TileServer dataset importer.
            - { name: TILE_SERVER_CACHE_ROOT, value: /tile-server/data/mbtiles/geodata }
            - { name: TILE_SERVER_INTERNAL_URL, value: http://tile-server:8080 }
            - { name: TILE_SERVER_WARM_TIMEOUT, value: 2m }
            - { name: S3_ENDPOINT, value: http://seaweedfs-s3.storage.svc.cluster.local:8333 }
            - { name: S3_REGION, value: us-east-1 }
            - { name: S3_DERIVED_BUCKET, value: geodata-derived }
            - { name: POSTGRES_HOST, value: geodata-catalog-postgresql.tile-server.svc.cluster.local }
            - { name: POSTGRES_PORT, value: "5432" }
            - { name: POSTGRES_SSLMODE, value: disable }
            - name: POSTGRES_DATABASE
              valueFrom: { secretKeyRef: { name: geodata-cache-warmer-catalog, key: database } }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: geodata-cache-warmer-catalog, key: username } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: geodata-cache-warmer-catalog, key: password } }
            - name: S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: geodata-cache-warmer-s3, key: access-key } }
            - name: S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: geodata-cache-warmer-s3, key: secret-key } }
          volumeMounts:
            - { name: tile-data, mountPath: /tile-server/data }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
      volumes:
        - name: tile-data
          persistentVolumeClaim:
            # This is the existing PVC owned by gf-webgis TileServer.
            claimName: tile-data
