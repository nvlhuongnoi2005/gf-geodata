apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: geodata-tileserver-cache-warmer-egress
  namespace: webgis
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: geodata-tileserver-cache-warmer
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tile-server
      ports: [{ protocol: TCP, port: 8080 }]
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tile-server
          podSelector:
            matchLabels:
              app.kubernetes.io/name: geodata-catalog-postgresql
      ports: [{ protocol: TCP, port: 5432 }]
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: storage
          podSelector:
            matchLabels:
              app.kubernetes.io/name: seaweedfs
      ports: [{ protocol: TCP, port: 8333 }]
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # Kubernetes Service CIDR in the local cluster. Keep this port-only rule
    # for the warmer's narrowly-scoped deployment patch request.
    - to:
        - ipBlock: { cidr: 10.96.0.0/12 }
      ports: [{ protocol: TCP, port: 443 }]
---
# Additive policy: TileServer remains private, but accepts only the GeoData
# gateway in tile-server and the local warmer that verifies a newly warmed file.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tile-server-allow-geodata
  namespace: webgis
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tile-server
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tile-server
          podSelector:
            matchLabels:
              app.kubernetes.io/name: geodata-tile-gateway
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: geodata-tileserver-cache-warmer
      ports: [{ protocol: TCP, port: 8080 }]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: geodata-tileserver-cache-warmer
  namespace: webgis
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: geodata-tileserver-cache-warmer
  namespace: webgis
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [tile-server]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: geodata-tileserver-cache-warmer
  namespace: webgis
subjects:
  - kind: ServiceAccount
    name: geodata-tileserver-cache-warmer
    namespace: webgis
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: geodata-tileserver-cache-warmer
