apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: geodata-tile-gateway-private
  namespace: tile-server
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: geodata-tile-gateway
  policyTypes: [Ingress, Egress]
  ingress:
    # GeoData's own frontend reaches the gateway through its nginx proxy.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: geodata-frontend
      ports: [{ protocol: TCP, port: 8091 }]
    # WebGIS Controller is the only cross-namespace caller. It forwards the
    # browser JWT so the gateway still evaluates GeoData release ACLs.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: webgis
          podSelector:
            matchLabels:
              app.kubernetes.io/name: controller
      ports: [{ protocol: TCP, port: 8091 }]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: geodata-catalog-postgresql
      ports: [{ protocol: TCP, port: 5432 }]
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: webgis
          podSelector:
            matchLabels:
              app.kubernetes.io/name: tile-server
      ports: [{ protocol: TCP, port: 8080 }]
    # Resolve a signed-in user's current organisation for restricted-release
    # grants. The database role itself is SELECT-only on public.users.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: webgis
          podSelector:
            matchLabels:
              app.kubernetes.io/name: auth-postgres
      ports: [{ protocol: TCP, port: 5432 }]
    # Temporary legacy path. Remove after old object-store releases are retired.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: storage
          podSelector:
            matchLabels:
              app.kubernetes.io/name: seaweedfs
      ports: [{ protocol: TCP, port: 8333 }]
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
