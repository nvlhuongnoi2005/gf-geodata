apiVersion: apps/v1
kind: Deployment
metadata:
  name: geodata-worker
  namespace: tile-server
  labels:
    app.kubernetes.io/name: geodata-worker
    app.kubernetes.io/part-of: geodata
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: geodata-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: geodata-worker
        app.kubernetes.io/part-of: geodata
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: conversion-worker
          image: ghcr.io/nvlhuongnoi2005/tile-server/geodata-worker:dev
          imagePullPolicy: Always
          env:
            - name: S3_ENDPOINT
              value: http://seaweedfs-s3.storage.svc.cluster.local:8333
            - name: S3_REGION
              value: us-east-1
            - name: S3_RAW_BUCKET
              value: geodata-raw
            - name: S3_DERIVED_BUCKET
              value: geodata-derived
            - name: POSTGRES_HOST
              value: geodata-catalog-postgresql
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_SSLMODE
              value: disable
            - name: JOB_POLL_INTERVAL
              value: 5s
            - name: WORKSPACE_ROOT
              value: /work
            # These are Tilemaker's built-in, OpenMapTiles-compatible defaults.
            - name: TILEMAKER_CONFIG_PATH
              value: /usr/src/app/resources/config-openmaptiles.json
            - name: TILEMAKER_PROCESS_PATH
              value: /usr/src/app/resources/process-openmaptiles.lua
            - name: POSTGRES_DATABASE
              valueFrom:
                secretKeyRef:
                  name: geodata-catalog-postgresql
                  key: database
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: geodata-catalog-postgresql
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: geodata-catalog-postgresql
                  key: password
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: geodata-worker-s3
                  key: access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: geodata-worker-s3
                  key: secret-key
          volumeMounts:
            - name: workspace
              mountPath: /work
          resources:
            requests:
              # Scheduler reserves this amount. Keep it small enough for a
              # single-node Docker Desktop development cluster; Tilemaker uses
              # the on-disk --store workspace to avoid reserving its peak RAM.
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "4"
              memory: 8Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: [ALL]
      volumes:
        - name: workspace
          emptyDir:
            sizeLimit: 50Gi
