apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: geodata-upload-private
  namespace: tile-server
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: geodata-upload
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: geodata-frontend
      ports:
        - protocol: TCP
          port: 8090
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: storage
          podSelector:
            matchLabels:
              app.kubernetes.io/name: seaweedfs
      ports:
        - protocol: TCP
          port: 8333
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: webgis
          podSelector:
            matchLabels:
              app.kubernetes.io/name: controller
      ports:
        - protocol: TCP
          port: 3001
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
