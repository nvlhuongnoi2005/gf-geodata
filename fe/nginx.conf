server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /auth/ {
    proxy_pass http://controller.webgis.svc.cluster.local:3001;
    proxy_http_version 1.1;
    # Map Auth only accepts its configured WebGIS origin. The browser calls this
    # same-origin proxy; do not forward an arbitrary browser Origin upstream.
    proxy_set_header Origin http://webgis.localhost;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Browser uploads go through the authenticated API, never directly to S3.
  location /api/geodata/ {
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_pass http://geodata-upload.tile-server.svc.cluster.local:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Published tiles are served by the dedicated gateway, never by the upload API.
  location /tiles/ {
    proxy_http_version 1.1;
    proxy_pass http://geodata-tile-gateway.tile-server.svc.cluster.local:8091/;
    proxy_set_header Authorization $http_authorization;
  }

  # The stock nginx mime.types file knows .js but not Vite's .mjs worker.
  # MapLibre loads this as an ES module, therefore application/octet-stream
  # is rejected by browsers before a map can be created.
  location ~* ^/assets/.+\.mjs$ {
    try_files $uri =404;
    default_type application/javascript;
    add_header X-Content-Type-Options nosniff always;
  }

  # Hashed Vite assets must never be rewritten to the SPA document. A missing
  # asset is a real 404, not HTML.
  location /assets/ {
    try_files $uri =404;
    add_header X-Content-Type-Options nosniff always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

