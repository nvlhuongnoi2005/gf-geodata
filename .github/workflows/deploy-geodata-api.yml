name: Build and deploy GeoData API

on:
  push:
    branches: [master]
    paths:
      - api/**
      - deployment/api/**
      - deployment/database/**
      - deployment/kustomization.yaml
      - .github/workflows/deploy-geodata-api.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-geodata-api-production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/tile-server/geodata-api
  NAMESPACE: tile-server

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: api/go.mod }
      - name: Test Go API
        working-directory: api
        run: go test ./...
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
      - name: Configure cluster access
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          if [ -z "$KUBE_CONFIG_DATA" ]; then
            echo "KUBE_CONFIG_DATA is empty or unavailable to this workflow" >&2
            exit 1
          fi
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG_DATA" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl config current-context > /dev/null
          cluster_server="$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')"
          if [ -z "$cluster_server" ] || [ "$cluster_server" = "http://localhost:8080" ]; then
            echo "Kubeconfig has no valid cluster server" >&2
            exit 1
          fi
      - name: Verify cluster access
        run: kubectl --request-timeout=10s get --raw=/version > /dev/null
      - name: Apply database and API manifests
        run: kubectl apply -k deployment
      - name: Roll out migration and API
        run: |
          IMAGE="${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
          kubectl -n "$NAMESPACE" set image deployment/geodata-api api="$IMAGE" migrate="$IMAGE"
          kubectl -n "$NAMESPACE" rollout status deployment/geodata-api --timeout=10m
          kubectl -n "$NAMESPACE" get pods -l app.kubernetes.io/name=geodata-api
