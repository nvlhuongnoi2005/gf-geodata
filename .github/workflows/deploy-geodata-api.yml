name: Build and deploy GeoData API

on:
  push:
    branches: [master]
    paths:
      - api/**
      - deployment/api/**
      - deployment/database/**
      - deployment/kustomization.yaml
      - .github/workflows/deploy-geodata-api.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-geodata-api-production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/tile-server/geodata-api
  NAMESPACE: tile-server

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: api/go.mod }
      - name: Test Go API
        working-directory: api
        run: go test ./...
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
      - name: Configure cluster access
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 --decode > "$HOME/.kube/config"
      - name: Apply database and API manifests
        run: kubectl apply -k deployment
      - name: Roll out migration and API
        run: |
          IMAGE="${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
          kubectl -n "$NAMESPACE" set image deployment/geodata-api api="$IMAGE" migrate="$IMAGE"
          kubectl -n "$NAMESPACE" rollout status deployment/geodata-api --timeout=10m
          kubectl -n "$NAMESPACE" get pods -l app.kubernetes.io/name=geodata-api
