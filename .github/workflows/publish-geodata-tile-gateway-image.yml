name: Publish GeoData tile gateway image
on:
  push:
    branches: [master]
    paths: [api/**, .github/workflows/publish-geodata-tile-gateway-image.yml]
  workflow_dispatch:
permissions: { contents: read, packages: write }
env: { IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/tile-server/geodata-tile-gateway }
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: ${{ github.actor }}, password: ${{ secrets.GITHUB_TOKEN }} }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile.gateway
          push: true
          tags: ${{ env.IMAGE_NAME }}:dev,${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
