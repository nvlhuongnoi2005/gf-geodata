name: Publish development frontend image

on:
  push:
    branches: [master]
    paths:
      - fe/**
      - fe/nginx.conf
      - package.json
      - package-lock.json
      - .github/workflows/publish-dev-image.yml
  workflow_dispatch:

# The package is published as ghcr.io/<owner>/tile-server/front-end.
permissions:
  contents: read
  packages: write

concurrency:
  group: publish-frontend-dev-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/tile-server/front-end

jobs:
  publish:
    name: Build and push :dev
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: fe/Dockerfile
          push: true
          build-args: |
            NODE_IMAGE=node:24-alpine
            NGINX_IMAGE=nginx:1.27-alpine
          tags: |
            ${{ env.IMAGE_NAME }}:dev
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
